<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joshua & Anjanette | Save The Date</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="intro-overlay">
        <div class="mirror-container">
            <div class="magic-mirror">
                <div class="mirror-glass">
                    <div class="enchanted-rose-glow">🌹</div>
                    <p class="mirror-text">Be Our Guest</p>
                </div>
                <button id="wax-seal" aria-label="Open Invitation">
                    <svg class="seal-fingerprint" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ffffff"/>
                                <stop offset="30%" stop-color="#f7e08a"/>
                                <stop offset="70%" stop-color="#B59410"/>
                                <stop offset="100%" stop-color="#544403"/>
                            </linearGradient>
                        </defs>
                        <g fill="none" stroke="url(#gold-grad)" stroke-width="2.5" stroke-linecap="round">
                            <path d="M 15,90 A 45,45 0 0,1 85,90" />
                            <path d="M 22,80 A 38,38 0 0,1 78,80" />
                            <path d="M 10,50 A 40,40 0 0,1 90,50" />
                            <path d="M 18,45 A 32,32 0 0,1 82,45" />
                            <path d="M 28,60 C 28,30 72,30 72,60 C 72,75 65,85 65,95" />
                            <path d="M 35,65 C 35,42 65,42 65,65 C 65,80 58,88 58,98" />
                            <path d="M 42,70 C 42,52 58,52 58,70 C 58,82 50,88 50,100" />
                            <path d="M 48,75 C 48,62 52,62 52,75 v 20" />
                            <path d="M 5,60 A 45,42 0 0,1 95,60" />
                            <path d="M 30,25 A 25,22 0 0,1 70,25" />
                            <path d="M 38,18 A 15,12 0 0,1 62,18" />
                        </g>
                    </svg>
                </button>
            </div>
            <div class="mirror-handle"></div>
        </div>
    </div>

    <div id="petal-container"></div>

    <div class="container">
        <img src="backgogogo.png" alt="Joshua & Anjanette" class="profile-photo slide-in">
        
        <h1 class="names slide-in">
            <span class="top-name">Anjanette</span>
            <span class="middle-word">&</span>
            <span class="bottom-name">Joshua</span>
        </h1>

        <p class="subtitle fade-up">Save the Date</p>

        <div id="countdown" class="fade-up">
            <div class="time-box"><span id="days">00</span><small>DAYS</small></div>
            <div class="time-box"><span id="hours">00</span><small>HRS</small></div>
            <div class="time-box"><span id="minutes">00</span><small>MINS</small></div>
            <div class="time-box"><span id="seconds">00</span><small>SECS</small></div>
        </div>

        <div class="event-details fade-up">
            <p class="date"><b>SEPTEMBER 19, 2026</b></p>
            <p><a href="https://maps.app.goo.gl/1LUuQvefVpjCDRQ28" target="_blank" class="venue-link">ST. MARK CATHEDRAL</a></p>
            <p><a href="https://maps.app.goo.gl/V9qNxVp2aiiKnSh27" target="_blank" class="venue-link">DOS VILLA</a></p>
        </div>

        <div class="palette-wrap fade-up">
            <p class="palette-label">DRESS CODE:</p>
            <div class="color-cubes">
                <div class="cube" style="background: #FFFFFF;"></div>
                <div class="cube" style="background: #000000;"></div>
                <div class="cube" style="background: #A57756;"></div>
                <div class="cube" style="background: #CBAC8D;"></div>
            </div>
        </div>

        <a href="https://docs.google.com/forms/d/e/1FAIpQLScr-dKpNfhd4oMu4u3ymgh1kXsMvftQqggleZElVwtqb6UX3Q/viewform?usp=header" class="rsvp-btn fade-up">BE OUR GUEST</a>
    </div>

    <div id="player" style="position: absolute; top: -9999px;"></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
</body>
</html>
